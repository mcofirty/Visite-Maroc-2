<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>marhaba</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/favicon.ico" sizes="48x48">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="marhaba">
<meta name="application-name" content="marhaba">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600&family=Marcellus&display=swap">
<style>
/* Layout : sobriété façon iOS — fond groupé gris, cartes blanches sans bordure, grand titre, barre d'onglets translucide ; couleurs pleines, aucun dégradé */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --ink:#1C1C1E; --muted:#6E6E73; --sep:#E5E5EA; --fill:rgba(118,118,128,.12);
  --bar:rgba(249,249,251,.86);
  --accent:#2D4BE0; --accent-ink:#FFFFFF; --accent-soft:rgba(45,75,224,.10);
  --saffron:#E39A12; --saffron-ink:#8A5A00; --saffron-soft:rgba(227,154,18,.14);
  --warn:#C2511A; --warn-soft:rgba(194,81,26,.10);
  --font-display:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Geist", "Segoe UI", system-ui, sans-serif;
  --font-body:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Geist", "Segoe UI", system-ui, sans-serif;
  --font-mono:ui-monospace, "SF Mono", "Geist Mono", Menlo, monospace;
  --radius:16px; --nav-h:62px;
  --glass:rgba(255,255,255,.62); --glass-bar:rgba(255,255,255,.66); --glass-tint:rgba(45,75,224,.10); --glass-accent:rgba(45,75,224,.86);
  --glass-edge:rgba(255,255,255,.85); --glass-hi:rgba(255,255,255,.95); --glass-lo:rgba(255,255,255,.35);
  --glass-shadow:0 8px 24px -10px rgba(16,24,64,.28), 0 1px 3px rgba(16,24,64,.08);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --ink:#FFFFFF; --muted:#98989F; --sep:#38383A; --fill:rgba(118,118,128,.24);
  --bar:rgba(22,22,24,.86);
  --accent:#7F95FF; --accent-ink:#000000; --accent-soft:rgba(127,149,255,.16);
  --saffron:#F2AE2E; --saffron-ink:#F2AE2E; --saffron-soft:rgba(242,174,46,.16);
  --warn:#FF9F6E; --warn-soft:rgba(255,159,110,.14);
  --glass:rgba(58,58,64,.48); --glass-bar:rgba(36,36,40,.58); --glass-tint:rgba(127,149,255,.16); --glass-accent:rgba(127,149,255,.82);
  --glass-edge:rgba(255,255,255,.16); --glass-hi:rgba(255,255,255,.28); --glass-lo:rgba(255,255,255,.06);
  --glass-shadow:0 10px 28px -10px rgba(0,0,0,.7), 0 1px 3px rgba(0,0,0,.4);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --ink:#FFFFFF; --muted:#98989F; --sep:#38383A; --fill:rgba(118,118,128,.24);
  --bar:rgba(22,22,24,.86);
  --accent:#7F95FF; --accent-ink:#000000; --accent-soft:rgba(127,149,255,.16);
  --saffron:#F2AE2E; --saffron-ink:#F2AE2E; --saffron-soft:rgba(242,174,46,.16);
  --warn:#FF9F6E; --warn-soft:rgba(255,159,110,.14);
  --glass:rgba(58,58,64,.48); --glass-bar:rgba(36,36,40,.58); --glass-tint:rgba(127,149,255,.16); --glass-accent:rgba(127,149,255,.82);
  --glass-edge:rgba(255,255,255,.16); --glass-hi:rgba(255,255,255,.28); --glass-lo:rgba(255,255,255,.06);
  --glass-shadow:0 10px 28px -10px rgba(0,0,0,.7), 0 1px 3px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card,.stat,.info,.log li,.empty,.alt{background:var(--surface);border-radius:var(--radius)}

/* ---------- En-tête : grand titre ---------- */
.hero .wrap{padding-block:14px 4px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand{display:flex;align-items:center;gap:8px}
.brand .logo{width:26px;height:30px;flex:none}
.lg-arch{fill:var(--accent)}
.lg-dot{fill:var(--saffron)}
.brand b{font-size:17px;font-weight:600;letter-spacing:-.02em}
.brand span{display:none}
.hero h1{font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1.1;letter-spacing:-.025em;margin:14px 0 4px;text-wrap:balance}
.hero h1 em{font-style:normal}
.hero p{margin:0;color:var(--muted);font-size:15px}
.route{display:flex;gap:6px;margin-top:12px;font-size:13px;font-weight:500;flex-wrap:wrap}
.route span{background:var(--fill);padding:4px 10px;border-radius:999px}
.ring{flex:none;width:48px;height:48px;position:relative}
.ring svg{width:48px;height:48px;transform:rotate(-90deg)}
.ring .track{stroke:var(--sep)}
.ring .arc{stroke:var(--accent)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- Jours ---------- */
.days{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
.days .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-block:8px}
.day-btn{border:0;background:var(--surface);border-radius:12px;padding:7px 4px 7px;text-align:center;display:grid;gap:0;position:relative}
.day-btn .d{font-weight:600;font-size:15px}
.day-btn .c{font-size:11px;color:var(--muted)}
.day-btn .bar{height:3px;border-radius:3px;background:var(--fill);margin:5px 12px 0;overflow:hidden}
.day-btn .bar i{display:block;height:100%;background:var(--saffron)}
.day-btn[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.day-btn[aria-selected="true"] .c{color:var(--accent-ink);opacity:.8}
.day-btn[aria-selected="true"] .bar{background:rgba(255,255,255,.3)}
.day-btn[aria-selected="true"] .bar i{background:var(--accent-ink)}
.today-dot{position:absolute;top:7px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--saffron)}

/* ---------- En-tête du jour ---------- */
.day-head{padding-block:20px 4px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.day-head h2{font-family:var(--font-display);font-weight:700;letter-spacing:-.02em;font-size:24px;margin:0;line-height:1.15}
.day-head .sub{color:var(--muted);font-size:14px;margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap;background:var(--accent-soft);color:var(--accent)}
.btn:active{opacity:.6}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.small{padding:7px 12px;font-size:13px}
.btn svg{width:15px;height:15px;flex:none}

/* ---------- Frise ---------- */
.timeline{--tc:46px;--tg:26px;list-style:none;margin:10px 0 0;padding:0;display:grid;gap:12px;position:relative}
.timeline::before{content:"";position:absolute;left:calc(var(--tc) + var(--tg)/2 - 1px);top:24px;bottom:24px;width:2px;background:var(--sep)}
.step{display:grid;grid-template-columns:var(--tc) 1fr;gap:var(--tg)}
.when{position:relative;font-size:13px;font-weight:600;padding-top:16px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.when::after{content:"";position:absolute;right:calc(var(--tg)/-2 - 6px);top:19px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2.5px solid var(--saffron);box-sizing:border-box}
.step.done .when::after{background:var(--saffron)}
.card{padding:14px 16px;min-width:0}
.card-top{display:flex;gap:10px;align-items:flex-start}
.card-top .t{flex:1;min-width:0}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--accent)}
.tag.extra{color:var(--saffron-ink)}
.card h3{margin:2px 0 2px;font-size:17px;line-height:1.25;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.where{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.check{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--sep);background:transparent;display:grid;place-items:center;color:transparent;padding:0}
.check svg{width:14px;height:14px}
.step.done .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.desc{margin:8px 0 0;font-size:15px}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.fact{font-size:13px;background:var(--fill);padding:3px 9px;border-radius:999px}
.tips{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:5px}
.tips li{font-size:14px;padding-left:14px;position:relative;color:var(--muted)}
.tips li::before{content:"";position:absolute;left:2px;top:.6em;width:5px;height:5px;border-radius:50%;background:var(--saffron)}
.alert{margin-top:10px;font-size:14px;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:9px 11px;font-weight:500}
.alt{margin-top:10px;background:var(--fill);border-radius:12px;padding:10px 12px}
.alt h4{margin:0 0 3px;font-size:15px;font-weight:600}
.phone-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:14px}
.phone-line .num{font-variant-numeric:tabular-nums;font-weight:600;user-select:all}
.phone-line .unk{color:var(--muted)}
.linkish{background:none;border:0;padding:0;color:var(--accent);font-weight:500;font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.review{margin-top:12px;padding-top:12px;border-top:.5px solid var(--sep);display:grid;gap:8px}
.rate-row{display:flex;align-items:center;gap:10px;min-width:0}
.review{grid-template-columns:minmax(0,1fr)}
.stars{display:flex;flex:1;min-width:0;max-width:260px}
.stars.sm{max-width:220px}
.dishes .star{color:color-mix(in srgb,var(--muted) 32%,transparent)}
.star{position:relative;flex:1;min-width:0;background:none;border:0;padding:0 1px;line-height:0;color:var(--sep);touch-action:manipulation}
.star svg{width:100%;height:auto;max-width:24px;display:block}
.star .fill{position:absolute;left:1px;top:0;width:calc(100% - 2px);max-width:24px;color:var(--saffron);pointer-events:none}
.star .fill svg{width:100%;max-width:none}
.stars.xs{flex:none;max-width:none}
.stars.xs .star{flex:none;padding:0}.stars.xs .star .fill{left:0;width:12px}
.stars.xs .star svg,.stars.xs .star .fill svg{width:12px;height:12px}
.stars.ro .star{cursor:default}
.score{flex:none;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.score small{color:var(--muted);font-weight:500}
.avg-note{font-size:13px;color:var(--muted)}
.dishes{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;background:var(--fill);border-radius:12px;padding:10px 12px}
.dishes h4{margin:0;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.dish{display:grid;grid-template-columns:minmax(0,1fr);gap:3px;padding-bottom:8px;border-bottom:.5px solid var(--sep)}
.dish:last-of-type{border-bottom:0;padding-bottom:0}
.dish-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dish-top b{font-weight:600;font-size:15px;min-width:0;overflow-wrap:anywhere}
.dish-del{background:none;border:0;color:var(--muted);font-size:13px;padding:0 2px}
.dish-add{display:flex;gap:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:8px;border-radius:8px;font-weight:600;font-size:15px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.04)}
.dish-add input{flex:1;min-width:0;border:0;background:var(--surface);border-radius:10px;padding:8px 11px;font-size:16px}
.log .dl{font-size:13px;color:var(--muted);margin:2px 0 0;padding:0;list-style:none}
.log .dl li{display:block;padding:1px 0;border:0;background:none}
.note{width:100%;border:0;background:var(--fill);border-radius:10px;padding:9px 11px;font-size:16px;resize:none;min-height:40px;overflow:hidden;field-sizing:content}
.inline-edit{display:flex;gap:6px;margin-top:8px}
.inline-edit input{flex:1;min-width:0;border:0;background:var(--fill);border-radius:10px;padding:8px 11px;font-size:16px}
.del{background:none;border:0;color:var(--warn);font-weight:500;font-size:14px;padding:0}
.add-row{display:flex;justify-content:center;margin:20px 0 6px}

/* ---------- Carnet ---------- */
.section-title{font-family:var(--font-display);font-weight:700;letter-spacing:-.025em;font-size:34px;margin:16px 0 4px}
.lead{color:var(--muted);margin:0 0 14px;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px 14px}
.stat b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--muted)}
.log{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:0;background:var(--surface);border-radius:var(--radius);overflow:hidden}
.log li{border-radius:0;padding:11px 16px;display:grid;gap:2px;background:none;border-bottom:.5px solid var(--sep)}
.log li:last-child{border-bottom:0}
.log .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.log .row strong{min-width:0;overflow-wrap:anywhere;font-weight:600}
.log .meta{font-size:13px;color:var(--muted)}
.log .mini{color:var(--saffron);font-size:14px;letter-spacing:1px;white-space:nowrap}
.log q{font-size:14px;color:var(--muted)}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:15px}

/* ---------- Infos ---------- */
.info-grid{display:grid;gap:12px}
.info{padding:14px 16px}
.info h3{margin:0 0 8px;font-size:17px;font-weight:600;letter-spacing:-.02em}
.info p{margin:0 0 8px;font-size:15px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.phrases{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.phrase{background:var(--fill);border-radius:10px;padding:8px 11px}
.phrase b{display:block;font-size:15px;font-weight:600}
.phrase span{font-size:13px;color:var(--muted)}
.field{display:grid;gap:4px;font-size:13px;font-weight:500;color:var(--muted)}
.field input,.field select,.field textarea{border:0;background:var(--fill);border-radius:10px;padding:10px 11px;color:var(--ink);font-size:16px;width:100%}
.stepper{display:inline-flex;align-items:center;border-radius:9px;overflow:hidden;background:var(--fill)}
.stepper button{border:0;background:transparent;width:40px;height:32px;font-size:18px;font-weight:500}
.stepper output{min-width:32px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- Barre d'onglets ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--nav-h)}
.nav button{border:0;background:none;display:grid;place-items:center;align-content:center;gap:2px;font-size:10px;font-weight:500;color:var(--muted)}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--accent)}

/* ---------- Feuille d'ajout ---------- */
.sheet{position:fixed;inset:0;z-index:60;display:grid;align-items:end;background:rgba(0,0,0,.3)}
.sheet .panel{background:var(--bg);border-radius:14px 14px 0 0;max-height:92vh;overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));width:100%;max-width:720px;margin:0 auto}
.sheet .panel::before{content:"";display:block;width:36px;height:5px;border-radius:5px;background:var(--sep);margin:-6px auto 12px}
.sheet h3{font-family:var(--font-display);font-weight:700;letter-spacing:-.02em;font-size:22px;margin:0 0 12px}
.form{display:grid;gap:10px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:500;z-index:70;max-width:calc(100% - 32px);text-align:center}

/* ---------- Liquid glass : boutons et barres de navigation uniquement ---------- */
.btn,.day-btn,.check,.nav .in,.nav button[aria-current="page"],.stepper{
  border:.5px solid var(--glass-edge);
  box-shadow:inset 0 1px 0 var(--glass-hi), inset 0 -1px 0 var(--glass-lo), var(--glass-shadow);
}
.btn{background:var(--glass-tint);transition:transform .15s,box-shadow .15s}
.btn:active{opacity:1;transform:scale(.96);box-shadow:inset 0 1px 0 var(--glass-hi), inset 0 -1px 0 var(--glass-lo)}
.btn.primary{background:var(--glass-accent);color:var(--accent-ink);border-color:rgba(255,255,255,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.5), inset 0 -1px 0 rgba(0,0,0,.08), 0 8px 20px -8px rgba(45,75,224,.55)}
.btn.ghost{background:var(--glass);color:var(--ink)}
.check{background:var(--glass);border:1.5px solid color-mix(in srgb,var(--muted) 45%,transparent)}
.step.done .check{background:var(--glass-accent);border-color:rgba(255,255,255,.45);color:var(--accent-ink)}
.stepper{background:var(--glass)}

/* Barre des jours : bande translucide, jours en capsules de verre */
.days{background:var(--glass-bar);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-bottom:.5px solid var(--glass-edge);box-shadow:0 1px 0 var(--sep)}
.day-btn{background:var(--glass);transition:transform .15s}
.day-btn:active{transform:scale(.96)}
.day-btn[aria-selected="true"]{background:var(--glass-accent);border-color:rgba(255,255,255,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.5), inset 0 -1px 0 rgba(0,0,0,.08), 0 8px 20px -8px rgba(45,75,224,.55)}

/* Barre d'onglets : pilule de verre flottante */
body{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 40px)}
.nav{background:none;-webkit-backdrop-filter:none;backdrop-filter:none;border-top:0;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.nav .in{pointer-events:auto;max-width:400px;height:var(--nav-h);border-radius:999px;padding:5px;background:var(--glass-bar);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%)}
.nav button{border-radius:999px;border:.5px solid transparent;transition:background .2s,color .2s}

/* ---------- Carnet partagé : marocain minimaliste ---------- */
:root{--paper:#FBF8F3;--paper-ink:#1F1B16;--paper-muted:#857B6F;--paper-line:#E6DED2;--paper-blue:#2D4BE0;--paper-saffron:#C98710;--font-orn:"Marcellus","Cormorant Garamond",Georgia,serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#12110F;--paper-ink:#F1EBE2;--paper-muted:#A39A8E;--paper-line:#2E2A25;--paper-blue:#8EA0FF;--paper-saffron:#E9AE45}}
:root[data-theme="dark"]{--paper:#12110F;--paper-ink:#F1EBE2;--paper-muted:#A39A8E;--paper-line:#2E2A25;--paper-blue:#8EA0FF;--paper-saffron:#E9AE45}
body.shared,body.shared::before{background:var(--paper)}
body.shared .nav,body.shared .hero{display:none}
.mz{color:var(--paper-ink);max-width:560px;margin:0 auto;padding-block:calc(28px + env(safe-area-inset-top,0px)) 40px}
.mz-head{text-align:center;display:grid;justify-items:center;gap:10px}
.mz-arch{display:block;width:64px;height:78px;color:var(--paper-blue)}
.mz-kicker{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--paper-muted)}
.mz h1{font-family:var(--font-orn);font-weight:400;font-size:34px;line-height:1.1;letter-spacing:.01em;margin:0;text-wrap:balance}
.mz-sub{font-size:14px;color:var(--paper-muted);margin:0}
.mz-orn{display:flex;align-items:center;gap:12px;color:var(--paper-saffron);margin:26px 0}
.mz-orn::before,.mz-orn::after{content:"";flex:1;height:1px;background:var(--paper-line)}
.mz-orn svg{width:14px;height:14px;flex:none}
.mz-stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.mz-stats div{display:grid;gap:2px;padding:0 6px}
.mz-stats div+div{border-left:1px solid var(--paper-line)}
.mz-stats b{font-family:var(--font-orn);font-weight:400;font-size:28px;line-height:1}
.mz-stats span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-muted)}
.mz-fav{text-align:center;font-size:14px;color:var(--paper-muted);margin:18px 0 0}
.mz-fav b{color:var(--paper-ink);font-weight:600}
.mz-day{display:flex;align-items:center;justify-content:center;gap:10px;margin:34px 0 6px;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--paper-blue);font-weight:600}
.mz-day svg{width:9px;height:9px;color:var(--paper-saffron)}
.mz-city{text-align:center;font-family:var(--font-orn);font-size:22px;margin:0 0 6px}
.mz-list{list-style:none;margin:0;padding:0}
.mz-place{padding:18px 0;border-bottom:1px solid var(--paper-line);display:grid;gap:6px}
.mz-place:last-child{border-bottom:0}
.mz-row{display:flex;align-items:baseline;gap:10px}
.mz-row h3{flex:1;min-width:0;margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere}
.mz-score{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-orn);font-size:20px;white-space:nowrap}
.mz-score small{font-family:var(--font-body);font-size:12px;color:var(--paper-muted)}
.mz-score svg{width:12px;height:12px;color:var(--paper-saffron);align-self:center}
.mz-meta{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-muted)}
.mz-meta .ok{color:var(--paper-saffron)}
.mz-menu{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:4px}
.mz-menu li{display:flex;align-items:baseline;gap:6px;font-size:14px}
.mz-menu li span:first-child{min-width:0;overflow-wrap:anywhere}
.mz-menu li i{flex:1;border-bottom:1px dotted var(--paper-line);transform:translateY(-3px);min-width:16px}
.mz-menu li b{font-family:var(--font-orn);font-weight:400;font-size:16px;white-space:nowrap}
.mz-note{margin:2px 0 0;font-family:var(--font-orn);font-size:16px;line-height:1.45;color:var(--paper-ink);opacity:.85}
.mz-note::before{content:"« "}.mz-note::after{content:" »"}
.mz-empty{text-align:center;color:var(--paper-muted);font-size:15px;margin:30px 0}
.mz-foot{display:grid;justify-items:center;gap:12px;margin-top:34px;text-align:center}
.mz-foot .brand-mini{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--paper-muted)}
.mz-foot .brand-mini svg{width:14px;height:17px;color:var(--paper-blue)}
.mz-link{background:none;border:1px solid var(--paper-line);color:var(--paper-ink);border-radius:999px;padding:9px 18px;font-size:14px;font-weight:500}
.mz-link:active{opacity:.6}

/* Fenêtre de partage, même esprit */
.sheet.mz-sheet .panel{background:var(--paper);color:var(--paper-ink)}
.mz-sheet .mz-arch{width:40px;height:49px;margin:2px auto 4px;display:block}
.mz-sheet h3{font-family:var(--font-orn);font-weight:400;font-size:26px;text-align:center;margin:0 0 4px}
.mz-sheet .mz-sub{text-align:center;margin-bottom:6px}
.mz-sheet .field input{background:transparent;border:1px solid var(--paper-line);border-radius:12px}
.mz-sheet .share-link{background:transparent;border:1px dashed var(--paper-line);border-radius:12px;color:var(--paper-muted)}
.mz-sheet .lead,.mz-sheet .avg-note{color:var(--paper-muted)}
.mz-sheet .btn{background:transparent;color:var(--paper-ink);border:1px solid var(--paper-line);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.mz-sheet .btn.primary{background:var(--paper-blue);color:#fff;border-color:var(--paper-blue)}
.mz-sheet .share-link{font-family:var(--font-mono);font-size:12px}

/* ---------- Comportement d'app native ---------- */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;padding-bottom:0!important;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
input,textarea,select,.num,q,.desc{-webkit-user-select:text;user-select:text}
.scroller{position:fixed;inset:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:none;scrollbar-width:none;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 40px)}
.scroller::-webkit-scrollbar,.sheet .panel::-webkit-scrollbar{display:none;width:0;height:0}
.sheet .panel{scrollbar-width:none;overscroll-behavior:contain}
/* Pager : la page voisine est rendue à côté et glisse avec le doigt */
#view{position:relative;min-height:60vh}
#view.dragging{will-change:transform}
.peek{position:absolute;left:0;width:100%;pointer-events:none}
#days{position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
#days .days{position:static}
#days[hidden]{display:none}
/* Feuilles : entrée/sortie animées */
.sheet{animation:shFade .22s ease-out both}
.sheet .panel{animation:shUp .34s cubic-bezier(.2,.9,.25,1) both}
.sheet.closing{animation:shFadeOut .22s ease-in both}
.sheet.closing .panel{animation:shDown .24s cubic-bezier(.4,0,1,1) both}
@keyframes shFade{from{background:rgba(0,0,0,0)}}
@keyframes shFadeOut{to{background:rgba(0,0,0,0)}}
@keyframes shUp{from{transform:translateY(100%)}}
@keyframes shDown{to{transform:translateY(100%)}}
.toast{animation:toastIn .26s cubic-bezier(.2,.9,.25,1) both}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px) scale(.96)}}
/* Indicateur d'onglet qui glisse */
.nav .in{position:relative}
.nav .pill{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px) / 3);border-radius:999px;background:var(--glass-tint);box-shadow:inset 0 1px 0 var(--glass-hi);transition:transform .38s cubic-bezier(.3,1.25,.5,1);pointer-events:none}
.nav button{position:relative;z-index:1}
.nav button[aria-current="page"]{background:none!important;border-color:transparent!important;box-shadow:none!important}
.nav button svg{transition:transform .2s}
.nav button:active svg{transform:scale(.88)}
.card{transition:border-color .2s}
.check{transition:background-color .18s,border-color .18s,transform .15s}
.check:active{transform:scale(.88)}
.star:active svg{transform:scale(1.18)}
.star svg{transition:transform .12s}
.sheet .panel{transition:transform .2s}
@media (prefers-reduced-motion:reduce){.sheet,.sheet .panel,.toast{animation:none!important}.nav .pill{transition:none}}

@media (max-width:420px){
  .timeline{--tc:40px;--tg:22px}
  .when{font-size:12px}
  .phrases{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

try { const raw = localStorage.getItem(KEY); if (raw) { const old = JSON.parse(raw); S = Object.assign(S, old);
  if (!old.v) { Object.keys(S.rating).forEach(k => S.rating[k] = Math.min(10, S.rating[k] * 2)); S.v = 2; } } } catch(e) {}
S.dishes = S.dishes || {};
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

if (!S.day) {
  const wd = new Date().getDay();
  S.day = (DAYS.find(d => d.wd === wd) || DAYS[0]).id;
}

/* ================== Utilitaires ================== */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const cleanPhone = p => (p||"").replace(/[^\d+]/g,"").replace(/^00/,"+").replace(/^0(\d{9})$/,"+212$1");
const prettyPhone = p => { const c = cleanPhone(p); const m = c.match(/^\+212(\d)(\d{2})(\d{2})(\d{2})(\d{2})$/); return m ? `+212 ${m[1]}${m[2]} ${m[3]} ${m[4]} ${m[5]}` : c; };
const mapsSearch = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
const mapsDir = q => "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(q);
const ICON = {
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',
  wa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.7-5A8.5 8.5 0 1 1 8 19.4z"/><path d="M9 10c.5 2 2 3.5 4 4l1.2-1.2 2 .8v1.6c-4 .5-8.2-3.7-7.7-7.7H10l.8 2z"/></svg>',
  map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  ticket:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 0 0 4v4a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4a2 2 0 0 1 0-4V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2z" transform="translate(0 1)"/><path d="M14 5v14" stroke-dasharray="2 2"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2.8 2.9 5.9 6.4.9-4.6 4.5 1.1 6.4L12 17.5l-5.8 3 1.1-6.4L2.7 9.6l6.4-.9z"/></svg>'
};

function allItems(){
  const out = [];
  DAYS.forEach(d => {
    d.items.forEach(it => out.push({ ...it, day:d.id, dayName:d.name, extra:false }));
    S.extras.filter(x => x.day === d.id).forEach(x => out.push({ ...x, dayName:d.name, extra:true }));
  });
  return out;
}
function dayItems(dayId){
  const d = DAYS.find(x => x.id === dayId);
  const base = d.items.map(it => ({ ...it, day:d.id, dayName:d.name, extra:false }));
  const ex = S.extras.filter(x => x.day === dayId).map(x => ({ ...x, dayName:d.name, extra:true }));
  return base.concat(ex).sort((a,b) => (a.time||"99").localeCompare(b.time||"99"));
}
/* ---- Notes sur 10, demi-étoiles ; restaurants = moyenne des plats ---- */
const FOOD = ["Café","Dîner","Déjeuner","Petit-déj","Brunch","Rooftop"];
const isFood = it => it.food === true || (it.food !== false && FOOD.includes(it.cat));
const ratedDishes = id => (S.dishes[id] || []).filter(d => d.r > 0);
function ratingOf(id){ const ds = ratedDishes(id); return ds.length ? ds.reduce((a,d) => a + d.r, 0) / ds.length : (S.rating[id] || 0); }
const fmt = v => v ? String(Math.round(v * 10) / 10).replace(".", ",") : "–";
function starsHTML(value, o = {}){
  const shown = Math.round(value * 2) / 2;
  const btn = n => {
    const w = shown >= n ? 100 : shown >= n - .5 ? 50 : 0;
    const attrs = o.ro ? 'tabindex="-1" aria-hidden="true"' : `data-act="rate" data-id="${esc(o.id)}"${o.dish ? ` data-dish="${esc(o.dish)}"` : ""} data-v="${n}" aria-label="${n} sur 10 (touche la moitié gauche pour ${n - .5})"`;
    return `<button type="button" class="star" ${attrs}>${ICON.star}<span class="fill" style="clip-path:inset(0 ${100 - w}% 0 0)">${ICON.star}</span></button>`;
  };
  return `<div class="stars${o.size ? " " + o.size : ""}${o.ro ? " ro" : ""}" role="group" aria-label="${o.label || "Note"} : ${fmt(value)} sur 10">${Array.from({ length:10 }, (_, k) => btn(k + 1)).join("")}</div>`;
}
const scoreHTML = v => `<span class="score">${fmt(v)}<small>/10</small></span>`;

function phoneOf(it){ return S.phones[it.id] || it.phone || ""; }
function bookingText(it){
  const n = S.guests;
  return `Bonjour, je souhaiterais réserver une table pour ${n} personne${n>1?"s":""} ce ${it.dayName.toLowerCase()} vers ${it.time.replace(":","h")}. Merci beaucoup !`;
}
function toast(msg){
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; t.setAttribute("role","status");
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}
async function copy(text, okMsg){
  try { await navigator.clipboard.writeText(text); toast(okMsg || "Copié"); }
  catch(e){ toast("Copie impossible : sélectionne le texte à la main"); }
}

/* ================== Rendu : Programme ================== */
function stepHTML(it){
  const done = !!S.done[it.id];
  const ph = phoneOf(it);
  const q = it.addr || it.maps || it.place;
  const hotelQ = it.hotel ? (S.hotels[it.hotel] || "") : "";
  const callable = !it.oncf && !it.hotel && !["Visite","Balade"].includes(it.cat);
  let actions = "";
  if (ph) {
    actions += `<a class="btn primary small" href="tel:${cleanPhone(ph)}">${ICON.phone}Appeler</a>`;
    if (it.book) actions += `<a class="btn small" href="https://wa.me/${cleanPhone(ph).replace("+","")}?text=${encodeURIComponent(bookingText(it))}" target="_blank" rel="noopener">${ICON.wa}Réserver WhatsApp</a>`;
  }
  if (it.oncf) {
    actions += `<a class="btn primary small" href="${ONCF_URL}" target="_blank" rel="noopener">${ICON.ticket}Acheter le billet</a>`;
    actions += `<a class="btn small" href="tel:2255">${ICON.phone}ONCF 2255</a>`;
  }
  if (it.hotel) {
    actions += hotelQ
      ? `<a class="btn small" href="${mapsDir(hotelQ)}" target="_blank" rel="noopener">${ICON.map}Aller à l'hôtel</a>`
      : `<button class="btn small" data-act="goto-infos">${ICON.map}Renseigner mon hôtel</button>`;
  } else if (q) {
    actions += `<a class="btn small" href="${mapsDir(q)}" target="_blank" rel="noopener">${ICON.map}Itinéraire</a>`;
    if (!ph && callable) actions += `<a class="btn small" href="${mapsSearch(it.maps || q)}" target="_blank" rel="noopener">${ICON.phone}Trouver le n° / réserver</a>`;
  }
  if (it.email) actions += `<a class="btn small" href="mailto:${esc(it.email)}">${ICON.mail}E-mail</a>`;
  if (it.book && ph) actions += `<button class="btn small ghost" data-act="copy-book" data-id="${esc(it.id)}">${ICON.copy}Copier le message</button>`;

  let phoneLine = "";
  if (callable) {
    phoneLine = `<div class="phone-line">${ph
      ? `<span class="num">${esc(prettyPhone(ph))}</span>${it.phoneUnsure && !S.phones[it.id] ? '<span class="unk">· à vérifier</span>' : ""}<button class="linkish" data-act="copy-phone" data-v="${esc(prettyPhone(ph))}">copier</button><button class="linkish" data-act="edit-phone" data-id="${esc(it.id)}">modifier</button>`
      : `<span class="unk">Numéro non renseigné</span><button class="linkish" data-act="edit-phone" data-id="${esc(it.id)}">Ajouter le numéro</button>`}</div>
      <div class="inline-edit" id="pe-${esc(it.id)}" hidden><input id="pein-${esc(it.id)}" type="tel" inputmode="tel" placeholder="+212 6…" value="${esc(S.phones[it.id]||"")}"><button class="btn small primary" data-act="save-phone" data-id="${esc(it.id)}">OK</button></div>`;
  }

  const alt = it.alt ? `<div class="alt"><h4>${esc(it.alt.title)}</h4><div class="where">${esc(it.alt.text)}</div>
      <div class="actions"><a class="btn small" href="${mapsSearch(it.alt.maps)}" target="_blank" rel="noopener">${ICON.map}Voir ${esc(it.alt.place)} sur Maps</a></div></div>` : "";

  return `<li class="step${done?" done":""}" data-id="${esc(it.id)}">
    <div class="when">${esc((it.time||"").replace(":","h"))}</div>
    <article class="card">
      <div class="card-top">
        <div class="t">
          <span class="tag${it.extra?" extra":""}">${esc(it.extra ? "Ajouté · " + (it.cat||"Autre") : it.cat)}</span>
          <h3>${esc(it.title)}</h3>
          <div class="where">${esc(it.hotel ? (hotelQ || "Hôtel non renseigné") : (it.addr || it.place || ""))}</div>
        </div>
        <button class="check" data-act="toggle" data-id="${esc(it.id)}" aria-pressed="${done}" aria-label="${done?"Marquer comme à faire":"Marquer comme fait"}">${ICON.check}</button>
      </div>
      ${it.desc ? `<p class="desc">${esc(it.desc)}</p>` : ""}
      ${it.facts && it.facts.length ? `<div class="facts">${it.facts.map(f => `<span class="fact">${esc(f)}</span>`).join("")}</div>` : ""}
      ${it.alert ? `<div class="alert">${esc(it.alert)}</div>` : ""}
      ${it.tips && it.tips.length ? `<ul class="tips">${it.tips.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}
      ${phoneLine}
      ${actions ? `<div class="actions">${actions}</div>` : ""}
      ${alt}
      <div class="review">
        ${reviewHTML(it)}
        <textarea class="note" id="note-${esc(it.id)}" data-id="${esc(it.id)}" rows="1" placeholder="Mon avis, ce que j'ai commandé, à refaire ?">${esc(S.notes[it.id]||"")}</textarea>
        ${it.extra ? `<div><button class="del" data-act="del" data-id="${esc(it.id)}">Supprimer cette activité</button></div>` : ""}
      </div>
    </article>
  </li>`;
}

function reviewHTML(it){
  const ds = S.dishes[it.id] || [], rd = ratedDishes(it.id), v = ratingOf(it.id);
  const head = rd.length
    ? `<div class="rate-row">${starsHTML(v, { ro:true, label:"Note de l'établissement" })}${scoreHTML(v)}</div><div class="avg-note">Moyenne de ${rd.length} plat${rd.length > 1 ? "s" : ""} noté${rd.length > 1 ? "s" : ""}</div>`
    : `<div class="rate-row">${starsHTML(v, { id:it.id, label:"Ma note" })}${scoreHTML(v)}</div>`;
  if (!isFood(it)) return head;
  const list = ds.map(d => `<div class="dish">
      <div class="dish-top"><b>${esc(d.name)}</b><button class="dish-del" data-act="dish-del" data-id="${esc(it.id)}" data-dish="${esc(d.id)}" aria-label="Retirer ${esc(d.name)}">Retirer</button></div>
      <div class="rate-row">${starsHTML(d.r || 0, { id:it.id, dish:d.id, size:"sm", label:d.name })}${scoreHTML(d.r || 0)}</div>
    </div>`).join("");
  return `${head}
    <div class="dishes">
      <h4>Mes plats${ds.length ? ` · ${ds.length}` : ""}</h4>
      ${list || `<div class="avg-note">Ajoute ce que tu as goûté et note chaque plat : la note du lieu sera leur moyenne.</div>`}
      <div class="dish-add"><input id="dish-in-${esc(it.id)}" class="dish-in" data-id="${esc(it.id)}" placeholder="Ajouter un plat…" enterkeyhint="done" autocomplete="off"><button class="btn small primary" data-act="dish-add" data-id="${esc(it.id)}">${ICON.plus}Ajouter</button></div>
    </div>`;
}

function renderDays(){
  const box = $("#days"); if (!box) return;
  box.hidden = S.tab !== "programme" || !!SHARED;
  if (box.hidden) return;
  box.innerHTML = `<div class="days"><div class="wrap" role="tablist" aria-label="Jours">
    ${DAYS.map(x => {
      const its = dayItems(x.id); const p = its.length ? Math.round(its.filter(i=>S.done[i.id]).length / its.length * 100) : 0;
      const isToday = new Date().getDay() === x.wd;
      return `<button class="day-btn" role="tab" aria-selected="${x.id===S.day}" data-act="day" data-id="${x.id}">
        ${isToday ? '<span class="today-dot" title="Aujourd\'hui"></span>' : ""}
        <span class="d">${x.short}</span><span class="c">${esc(x.city)}</span><span class="bar"><i style="width:${p}%"></i></span></button>`;
    }).join("")}
  </div></div>`;
}

function renderProgramme(){
  const d = DAYS.find(x => x.id === S.day);
  const items = dayItems(d.id);
  const doneN = items.filter(i => S.done[i.id]).length;
  return `
  <div class="wrap">
    <div class="day-head">
      <div><h2>${d.name} · ${esc(d.city)}</h2><div class="sub">${esc(d.sub)} · ${doneN}/${items.length} fait${doneN>1?"s":""}</div></div>
      <button class="btn primary" data-act="add">${ICON.plus}Ajouter</button>
    </div>
    <ol class="timeline">${items.map(stepHTML).join("")}</ol>
    <div class="add-row"><button class="btn" data-act="add">${ICON.plus}Ajouter quelque chose que j'ai fait ${d.name.toLowerCase()}</button></div>
  </div>`;
}

/* ================== Rendu : Carnet ================== */
function renderCarnet(){
  const items = allItems();
  const done = items.filter(i => S.done[i.id]);
  const rated = items.filter(i => ratingOf(i.id));
  const avg = rated.length ? (rated.reduce((s,i) => s + ratingOf(i.id), 0) / rated.length) : 0;
  const withSomething = items.filter(i => S.done[i.id] || ratingOf(i.id) || (S.notes[i.id]||"").trim() || (S.dishes[i.id]||[]).length);
  const best = [...rated].sort((a,b) => ratingOf(b.id) - ratingOf(a.id))[0];
  return `<div class="wrap">
    <h2 class="section-title">Mon carnet</h2>
    <p class="lead">Tout ce que tu as fait, noté et commenté pendant le voyage.</p>
    <div class="stats">
      <div class="stat"><b>${done.length}/${items.length}</b><span>étapes faites</span></div>
      <div class="stat"><b>${fmt(avg)}${avg ? '<small style="font-size:13px;color:var(--muted)">/10</small>' : ""}</b><span>note moyenne</span></div>
      <div class="stat"><b>${S.extras.length}</b><span>ajouts perso</span></div>
    </div>
    ${best ? `<p class="lead" style="margin-top:14px">Coup de cœur pour l'instant : <strong>${esc(best.title)}</strong></p>` : ""}
    ${withSomething.length ? `<ul class="log">${withSomething.map(i => `<li>
        <div class="row"><strong>${esc(i.title)}</strong>${ratingOf(i.id) ? scoreHTML(ratingOf(i.id)) : ""}</div>
        ${ratingOf(i.id) ? starsHTML(ratingOf(i.id), { ro:true, size:"xs" }) : ""}
        <div class="meta">${esc(i.dayName)} · ${esc((i.time||"").replace(":","h"))} · ${esc(i.extra ? "ajouté" : i.cat)}${S.done[i.id] ? " · fait" : ""}</div>
        ${(S.dishes[i.id]||[]).length ? `<ul class="dl">${S.dishes[i.id].map(d => `<li>${esc(d.name)} · ${d.r ? fmt(d.r) + "/10" : "pas noté"}</li>`).join("")}</ul>` : ""}
        ${(S.notes[i.id]||"").trim() ? `<q>${esc(S.notes[i.id].trim())}</q>` : ""}
      </li>`).join("")}</ul>
      <div class="actions" style="margin-top:14px"><button class="btn primary" data-act="share">${ICON.share}Partager mon carnet</button><button class="btn" data-act="export">${ICON.copy}Copier en texte</button></div>`
    : `<div class="empty" style="margin-top:14px">Rien encore. Coche une étape ou donne-lui des étoiles dans « Programme », et elle apparaîtra ici.</div>`}
    <div class="add-row"><button class="btn primary" data-act="add">${ICON.plus}Ajouter une activité faite en plus</button></div>
  </div>`;
}

const b64u = {
  enc: bytes => { let t = ""; for (let i = 0; i < bytes.length; i += 0x8000) t += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(t).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); },
  dec: str => { let t = str.replace(/-/g,"+").replace(/_/g,"/"); while (t.length % 4) t += "="; const bin = atob(t); return Uint8Array.from(bin, c => c.charCodeAt(0)); }
};
async function packShare(obj){
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if (window.CompressionStream) {
    try { const out = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer()); return "z" + b64u.enc(out); } catch(e) {}
  }
  return "j" + b64u.enc(bytes);
}
async function unpackShare(str){
  const bytes = b64u.dec(str.slice(1));
  if (str[0] === "z") return JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text());
  return JSON.parse(new TextDecoder().decode(bytes));
}
function sharePayload(){
  const d = {};

}

/* Prépare la page voisine, alignée sur ce que l'écran affichera après le changement */
function makePeek(route, side){
  const v = $("#view");
  const curDays = !$("#days").hidden, nextDays = !(route === "carnet" || route === "infos");
  const daysH = $("#days .days")?.offsetHeight || $("#days").dataset.h || 0;
  if (curDays && daysH) $("#days").dataset.h = daysH;
  const heroBottom = $(".hero").offsetHeight;
  const viewTop = v.offsetTop, st = SC.scrollTop;
  let newScroll = Math.min(st, heroBottom);
  const newViewTop = heroBottom + (nextDays ? +($("#days").dataset.h || daysH || 0) : 0);
  const peek = document.createElement("div");
  peek.className = "peek"; peek.setAttribute("aria-hidden", "true");
  peek.style.left = (side * 100) + "%";
  peek.innerHTML = renderRoute(route);
  v.appendChild(peek);
  /* une page courte ne peut pas défiler aussi loin : on la place là où elle s'arrêtera vraiment */
  const pb = parseFloat(getComputedStyle(SC).paddingBottom) || 0;
  const maxS = Math.max(0, newViewTop + Math.max(peek.offsetHeight, innerHeight * .6) + pb - SC.clientHeight);
  newScroll = Math.round(Math.min(newScroll, maxS));
  peek.style.top = ((newViewTop - newScroll) - (viewTop - st)) + "px";
  return { peek, newScroll };
}
function finish(route, peekInfo){

  v.style.transition = "none"; v.style.transform = ""; v.classList.remove("dragging");
  commit(route);

  busy = false;
}
function slide(route, peekInfo, side, fromX = 0, velocity = 0){
  const v = $("#view"); busy = true; v.classList.add("dragging");
  const dist = Math.abs(-side * W() - fromX);
  const dur = Math.max(170, Math.min(340, velocity > 0 ? dist / Math.max(velocity, .9) : 300));
  v.style.transition = `transform ${dur}ms cubic-bezier(.22,.9,.24,1)`;
  requestAnimationFrame(() => { v.style.transform = `translate3d(${-side * W()}px,0,0)`; });
  let done = false;
  const end = () => { if (done) return; done = true; finish(route, peekInfo); };
  v.addEventListener("transitionend", end, { once:true });
  setTimeout(end, dur + 80);
  haptic();
}
function go(route, opts = {}){
  if (!ROUTES.includes(route) || busy) return;
  const from = routeOf(); if (route === from && !opts.force) return;
  if (opts.instant || matchMedia("(prefers-reduced-motion: reduce)").matches) { commit(route); render(); SC.scrollTop = Math.min(SC.scrollTop, $(".hero").offsetHeight); return; }
  const side = ROUTES.indexOf(route) > ROUTES.indexOf(from) ? 1 : -1;
  const info = makePeek(route, side);
  slide(route, info, side);
}
window.addEventListener("popstate", () => { if (SHARED) return; const r = (location.hash || "").slice(1); closeSheet(); if (ROUTES.includes(r)) go(r, { instant:true }); });
document.querySelector(".nav").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if (!b) return;
  if (b.dataset.tab === S.tab) { SC.scrollTo({ top:0, behavior:"smooth" }); return; }
  go(b.dataset.tab === "programme" ? S.day : b.dataset.tab);
});
function closeSheet(){ const el = $("#sheet"); if (el) dismissSheet(el); }
function dismissSheet(el){
  if (!el || el.classList.contains("closing")) return;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { el.remove(); return; }
  el.classList.add("closing");
  setTimeout(() => el.remove(), 240);
}

/* Glisser horizontalement : la page suit le doigt, la page voisine arrive en même temps */
(() => {
  let x0=0, y0=0, axis=null, dx=0, active=false, side=0, info=null, samples=[];
  const v = () => $("#view");
  const clearPeek = () => { info?.peek.remove(); info = null; side = 0; };
  SC.addEventListener("touchstart", e => {
    if (SHARED || busy || e.touches.length !== 1 || e.target.closest("select,.sheet") || (e.target.matches("input,textarea") && e.target === document.activeElement)) { active=false; return; }
    active=true; axis=null; dx=0; x0=e.touches[0].clientX; y0=e.touches[0].clientY; samples=[[Date.now(), x0]];
  }, { passive:true });
  SC.addEventListener("touchmove", e => {
    if (!active) return;
    const x = e.touches[0].clientX, mx = x - x0, my = e.touches[0].clientY - y0;
    if (!axis && (Math.abs(mx) > 8 || Math.abs(my) > 8)) axis = Math.abs(mx) > Math.abs(my) * 1.15 ? "x" : "y";
    if (axis !== "x") return;
    e.preventDefault();
    samples.push([Date.now(), x]); if (samples.length > 6) samples.shift();
    const want = mx < 0 ? 1 : -1, i = ROUTES.indexOf(routeOf()), j = i + want;
    const has = j >= 0 && j < ROUTES.length;
    if (want !== side) { clearPeek(); if (has) { info = makePeek(ROUTES[j], want); side = want; } }
    dx = has ? mx : mx * .22 / (1 + Math.abs(mx) / 300);
    const el = v(); el.classList.add("dragging"); el.style.transition = "none"; el.style.transform = `translate3d(${dx}px,0,0)`;
  }, { passive:false });
  const end = () => {
    if (!active) return; active = false;
    if (axis !== "x") return;
    const [t1, x1] = samples[0], [t2, x2] = samples[samples.length - 1];
    const vel = (x2 - x1) / Math.max(1, t2 - t1);            // px/ms, négatif = vers la gauche
    const i = ROUTES.indexOf(routeOf()), j = i + side;
    const go_ = info && side && (Math.abs(dx) > W() * .28 || (Math.sign(vel) === -side && Math.abs(vel) > .3));
    if (go_) { slide(ROUTES[j], info, side, dx, Math.abs(vel)); info = null; side = 0; return; }
    const el = v(); el.style.transition = "transform .32s cubic-bezier(.22,.9,.24,1)"; el.style.transform = "translate3d(0,0,0)";
    const keep = info; info = null; side = 0;
    setTimeout(() => { keep?.peek.remove(); el.style.transition = ""; el.style.transform = ""; el.classList.remove("dragging"); }, 330);
  };
  SC.addEventListener("touchend", end);
  SC.addEventListener("touchcancel", end);
})();

/* Bloquer le zoom (pincer, double-tap, Ctrl +/−, Ctrl + molette) */
["gesturestart","gesturechange","gestureend"].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive:false }));
document.addEventListener("touchmove", e => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive:false });
let lastTap = 0;
document.addEventListener("touchend", e => { const now = Date.now(); if (now - lastTap < 300 && !e.target.closest("input,textarea,select")) e.preventDefault(); lastTap = now; }, { passive:false });
document.addEventListener("dblclick", e => e.preventDefault());
document.addEventListener("wheel", e => { if (e.ctrlKey) e.preventDefault(); }, { passive:false });
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && ["+","-","=","0"].includes(e.key)) e.preventDefault(); });

/* Demi-étoile : la moitié gauche de l'étoile donne n − 0,5 */
function starValue(b, e){
  const n = +b.dataset.v;
  if (!e || e.detail === 0) return n;
  const r = b.getBoundingClientRect();
  return (e.clientX - r.left) < r.width / 2 ? n - .5 : n;
}
function addDish(id){
  const inp = document.getElementById("dish-in-" + id); const name = (inp?.value || "").trim();
  if (!name) { inp?.focus(); return; }
  (S.dishes[id] = S.dishes[id] || []).push({ id:"d" + Date.now().toString(36), name, r:0 });
  S.done[id] = true; save(); refreshItem(id);
  document.getElementById("dish-in-" + id)?.focus({ preventScroll:true });
  toast("Plat ajouté");
}
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.classList?.contains("dish-in")) { e.preventDefault(); addDish(e.target.dataset.id); } });

let resetArmed = false;
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === "day") { go(id); return; }
  if (act === "toggle") { S.done[id] ? delete S.done[id] : (S.done[id] = true); save(); refreshItem(id); haptic(); if (S.done[id]) toast("Fait ! Pense à le noter"); return; }
  if (act === "rate") {
    if (id === "__new") return;
    const v = starValue(b, e), dish = b.dataset.dish;
    if (dish) { const d = (S.dishes[id] || []).find(x => x.id === dish); if (!d) return; d.r = d.r === v ? 0 : v; S.done[id] = true; }
    else { S.rating[id] = S.rating[id] === v ? 0 : v; if (!S.rating[id]) delete S.rating[id]; else S.done[id] = true; }
    save(); refreshItem(id); haptic(); return;
  }
  if (act === "dish-add") { addDish(id); return; }
  if (act === "dish-del") { S.dishes[id] = (S.dishes[id] || []).filter(x => x.id !== b.dataset.dish); if (!S.dishes[id].length) delete S.dishes[id]; save(); refreshItem(id); toast("Plat retiré"); return; }
  if (act === "add") { openAdd(); return; }
  if (act === "goto-infos") { go("infos"); return; }
  if (act === "edit-phone") { const box = document.getElementById("pe-" + id); box.hidden = !box.hidden; if (!box.hidden) document.getElementById("pein-" + id).focus(); return; }
  if (act === "save-phone") { const v = document.getElementById("pein-" + id).value.trim(); if (v) S.phones[id] = v; else delete S.phones[id]; save(); render(); toast(v ? "Numéro enregistré" : "Numéro retiré"); return; }
  if (act === "copy-phone") { copy(b.dataset.v, "Numéro copié"); return; }
  if (act === "copy-book") { const it = allItems().find(i => i.id === id); copy(bookingText(it), "Message de réservation copié"); return; }
  if (act === "del") {
    if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "Confirmer la suppression ?"; return; }
    S.extras = S.extras.filter(x => x.id !== id); delete S.done[id]; delete S.rating[id]; delete S.notes[id]; delete S.dishes[id];
    save(); render(); toast("Activité supprimée"); return;
  }
  if (act === "guests") { S.guests = Math.max(1, Math.min(20, S.guests + (+b.dataset.v))); save(); $("#guests").textContent = S.guests; return; }
  if (act === "share") { openShare(); return; }
  if (act === "leave-shared") { SHARED = null; document.body.classList.remove("shared"); try { history.replaceState({ r:routeOf() }, "", "#" + routeOf()); } catch(_) {} render(); SC.scrollTop = 0; return; }
  if (act === "export") {
    const lines = ["Mon voyage Casablanca & Rabat", ""];
    DAYS.forEach(d => {
      const its = dayItems(d.id).filter(i => S.done[i.id] || ratingOf(i.id) || (S.notes[i.id]||"").trim() || (S.dishes[i.id]||[]).length);
      if (!its.length) return;
      lines.push(d.name.toUpperCase());
      its.forEach(i => {
        lines.push(`- ${i.time.replace(":","h")} ${i.title}${ratingOf(i.id) ? " — " + fmt(ratingOf(i.id)) + "/10" : ""}${(S.notes[i.id]||"").trim() ? " : " + S.notes[i.id].trim() : ""}`);
        (S.dishes[i.id] || []).forEach(dd => lines.push(`    · ${dd.name}${dd.r ? " — " + fmt(dd.r) + "/10" : ""}`));
      });
      lines.push("");
    });
    copy(lines.join("\n"), "Carnet copié"); return;
  }
  if (act === "reset") {
    if (!resetArmed) { resetArmed = true; b.textContent = "Confirmer : tout effacer"; return; }
    S = { v:2, done:{}, rating:{}, dishes:{}, notes:{}, phones:{}, extras:[], guests:2, hotels:{ casa:"", rabat:"" }, tab:"infos", day:S.day };
    resetArmed = false; save(); render(); toast("Données effacées"); return;
  }
});

document.addEventListener("input", e => {
  const t = e.target;
  if (t.tagName === "TEXTAREA" && !CSS.supports("field-sizing","content")) { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }
  if (t.classList.contains("note")) { const v = t.value; if (v.trim()) S.notes[t.dataset.id] = v; else delete S.notes[t.dataset.id]; clearTimeout(window.__nt); window.__nt = setTimeout(save, 350); }
  if (t.dataset.hotel) { S.hotels[t.dataset.hotel] = t.value; save(); }
});
document.addEventListener("change", e => { if (e.target.dataset.hotel) render(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

(async () => {
  const h = location.hash || "";
  if (h.startsWith("#partage=")) {
    document.body.classList.add("shared");
    try { SHARED = await unpackShare(decodeURIComponent(h.slice(9))); } catch(e) { SHARED = { error:true }; }
    render(); return;
  }
  const r = h.slice(1); if (ROUTES.includes(r)) { if (r === "carnet" || r === "infos") S.tab = r; else { S.tab = "programme"; S.day = r; } }
  render();
  try { history.replaceState({ r:routeOf() }, "", "#" + routeOf()); } catch(e) {}
})();
</script>
